<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="mathlive.min.js"></script>
<style>
    :root { --accent: #6fc6fb; --results: #9CDCFE; --error: #ff8a80; }
    html, body { margin: 0; height: 100%; background: transparent; color: #fff; overflow: hidden; }
    #editor { height: 100%; overflow-y: auto; padding: 8px 12px 8px 48px; box-sizing: border-box; cursor: text; counter-reset: line; margin-right: 4px;}
    math-field {
        display: block; width: 100%; box-sizing: border-box; min-height: 1.7em;
        font-size: 18px; color: #fff; background: transparent;
        border: none; outline: none; padding: 2px 6px;
        --caret-color: var(--accent);
        --selection-background-color: color-mix(in srgb, var(--accent) 35%, transparent);
        --contains-highlight-background-color: hsl(212, 5%, 34%);
        --text-highlight-background-color: transparent;
        --highlight-text: transparent;

    }
    math-field::part(virtual-keyboard-toggle), math-field::part(menu-toggle) { display: none; }
    math-field.result { color: var(--results); }
    math-field.error { color: var(--error); }
    body.idle math-field {--caret-color: transparent; }
    #editor > * {counter-increment: line; position: relative;}
    #editor > *::before {
        content: counter(line);
        position: absolute; right: 100%; top: 50%; transform: translatey(-50%);
        width: 32px; padding-right: 10px; text-align: right;
        color: #858585; font: 13px monospace;
    }
    #editor > div.out::before {top: 0; transform: 100%;}

    img.out { display: block; max-width: 100%; }
    
    div.plot { width: 500px; height: 400px; max-width: 100%; }
    div.plot canvas { display: block; width: 100%; height: 100%; cursor: default; }
    div.plot .legend { position: absolute; top: 8px; right: 8px; background: #1e1e1e; border: 1px solid #555566; border-radius: 4px; padding: 2px 8px; font-size: 14px; pointer-events: none; }
    div.plot .legend div { display: flex; align-items: center; gap: 6px; }
    div.plot .legend math-field { display: inline-block; width: auto; min-height: 0; padding: 0; font-size: 14px; }
    div.plot .swatch { width: 18px; height: 3px; }
    div.plot .coords { position: absolute; left: 8px; bottom: 6px; font: 12px monospace; color: #ccc; pointer-events: none; }


    #suggest {position: fixed; display: none; z-index: 10; background: #323232; font: 14px "Segoe-UI";
    width: 200px; max-height:  160px; overflow-y: auto; border-radius: 8px; padding: 4px; box-sizing: border-box;}
    #suggest div {padding: 3px 10px; color: #fff; cursor: pointer; text-align: left; border: 1px solid transparent; border-radius: 4px ;}
    #suggest div.active {background: #737373;}

    #suggest::-webkit-scrollbar { width: 6px; }
    #suggest::-webkit-scrollbar-track { background: transparent; }
    #suggest::-webkit-scrollbar-thumb { background: #737373; border-radius: 3px; }
    #suggest::-webkit-scrollbar-thumb:hover { background: #8a8a8a; }

        
    #tooltip {position: fixed; display: none; z-index: 11; background: #323232; color: #fff; font: 14px "Segoe-UI";
    max-width: 400px; padding: 6px 10px; border-radius: 6px; white-space: pre-wrap; pointer-events: none;}


    #editor::-webkit-scrollbar { width: 10px; }
    #editor::-webkit-scrollbar-track { background: #737373; border-radius: 5px; margin: 8px 0 20px 0; }
    #editor::-webkit-scrollbar-thumb { background: #1e1e1e; border-radius: 5px; }


</style></head>
<body>
<div id="editor"></div>
<div id="suggest"></div>
<div id="tooltip"></div>

<script>
    MathfieldElement.fontsDirectory = "./fonts"; 
    MathfieldElement.soundsDirectory = null;
    const editor = document.getElementById("editor");
    let bridge = null;

    const MATH = ["Ln", "Log", "Exp", "Sin", "Cos", "Tan", "ArcSin", "ArcCos", "ArcTan", "Sinh", "Cosh", "Tanh",
                  "ArcSinh", "ArcCosh", "ArcTanh", "Cbrt", "Abs", "Floor", "Ceil", "Round", "Degrees", "Radians",
                  "Gamma", "Erf"];
    const MATH_CALL = new RegExp(String.raw`(?<![A-Za-zæøåÆØÅ\\])(${MATH.join("|")})(?=\\left\(|\()`, "g");


    const FUNCTIONS = ["Help", "Afstem","pH","pOH","EnhedKonvertering","Loop","Analyse",
                    "BjerrumDiagram","UdbytteProcent","VolumenProcent","MasseProcent",
                    "DNATilPeptid","RNATilPeptid","MængdeBeregning","Puffer","pHTilKoncentration","Løs","PlotFunktion","NumeriskLøs"
                ];
    const ARGS = {
        BjerrumDiagram: ["export"],
        EnhedKonvertering: ["SI"],
        Help: FUNCTIONS,
        PlotFunktion: ["Interval = (xstart, xslut)"],
        NLøs: ["Variabel = ","StartGæt = "],
    };
    const wordColor = w => ["Help", "Loop"].includes(w) ? COLORS.control : FUNCTIONS.includes(w) ? COLORS.func : MATH.includes(w) ? COLORS.math : null;
    const COLORS = { control: "#C586C0", func: "#569CD6",math: "#c0dcaa", number: "#B5CEA8", string: "#CE9178", comment: "#9CDCFE",};
    const color = (c, x) => `\\textcolor{${c}}{${x}}`;

    // index just after the {...} group that starts at i (handles nested braces)
    function groupEnd(s, i) {
        let depth = 0;
        for (let j = i; j < s.length; j++) {
            if (s[j] === "\\") { j++; continue; }
            if (s[j] === "{") depth++;
            else if (s[j] === "}" && --depth === 0) return j + 1;
        }
        return s.length;
    }

    // remove the colours and bold that highlight() adds, keeping everything inside them
    function strip(latex) {
        for (const [cmd, args] of [["\\textcolor", 2], ["\\mathbf", 1], ["\\bm", 1]]) {
            let i;
            while ((i = latex.indexOf(cmd + "{")) !== -1) {
                let j = i + cmd.length;
                for (let a = 1; a < args; a++) j = groupEnd(latex, j);   // skip the colour argument
                const end = groupEnd(latex, j);
                latex = latex.slice(0, i) + latex.slice(j + 1, end - 1) + latex.slice(end);
            }
        }
        return latex;
    }

    // add syntax colours to one line; only styles are added, so the cursor position stays the same
    function highlight(latex) {
        const hash = latex.indexOf("\\#");
        if (hash !== -1) return (hash > 0 ? highlight(latex.slice(0, hash)) : "") + color(COLORS.comment, latex.slice(hash));
        latex = latex.replace(/\^\{\\prime\}(.*?)\^\{\\prime\}/g,
            (m, inner) => `^{\\prime}${inner ? color(COLORS.string, inner) : ""}^{\\prime}`);
        latex = latex.replace(/(?:(?<=\\cdot)|(?<![\\\w]))(?<!_\{)\d+(?:\.\d+)?/g, n => color(COLORS.number, n));
        latex = latex.replace(MATH_CALL, f => color(COLORS.math, f));

        const m = latex.match(/^((?:[A-Za-zæøåÆØÅ]|\\_)+)(?=\\:|\\left\(|\(|$)/);
        if (m) {
            const word = m[1].replace(/\\_/g, "_");
            const c = wordColor(word);
            if (c) latex = color(c, `\\mathbf{${m[1]}}`) + latex.slice(m[1].length);
        }
        return latex;
    }

    function setLine(mf, raw, position) {
        mf.recolouring = true;
        mf.value = highlight(raw);
        mf.recolouring = false;
        if (position !== undefined) mf.position = Math.min(position, mf.lastOffset);
    }

    // recolour after every keystroke, keeping the cursor where it was
    function recolour(mf) {
        if (mf.recolouring) return;
        const raw = strip(mf.value);
        if (highlight(raw) !== mf.value) setLine(mf, raw, mf.position);
    }


    // replace the line with head + middle + tail and put the cursor in the first empty box of middle
    function rebuild(mf, head, middle, tail) {
        setLine(mf, head + middle + tail);
        mf.position = 0;
        mf.executeCommand("moveToNextPlaceholder");
    }

    const BOX = "\\placeholder{}";

   
    // typing the letters "sqrt" turns them into a square root
    function makeSqrt(mf) {
        const before = strip(mf.getValue(0, mf.position, "latex"));
        if (!before.endsWith("sqrt")) return;
        const after = strip(mf.getValue(mf.position, mf.lastOffset, "latex"));
        rebuild(mf, before.slice(0, -4), `\\sqrt{${BOX}}`, after);
    }

    const suggest = document.getElementById("suggest");
    let matches = [], active=0,suggestFor = null;

    function currentWord(mf) {
        let word = "", p = mf.position;
        while (p > 0) {
            const c = strip(mf.getValue(p - 1, p, "latex"));
            if (!/^[A-Za-zæøåÆØÅ]$/.test(c)) break;
            word = c + word;
            p--;
        }
        return word;
    }


    function hideSuggest() {
        suggestFor = null;
        suggest.style.display = "none";
    }
    function variables() {
        const names = lines().map(l => strip(l.value).match(/^([A-Za-zæøåÆØÅ]+)(?:\\:|\s)*=/)?.[1]);
        return [...new Set(names.filter(n => n && !FUNCTIONS.includes(n)))];
    } 


    function updateSuggest(mf) {
        const word = currentWord(mf).toLowerCase();
        const func = strip(mf.value).match(/^([A-Za-zæøåÆØÅ]+)\\left\(/)?.[1];
        const args = ARGS[func] ?? [];
        const opened = strip(mf.getValue(mf.position - 1, mf.position, "latex")) === BOX;
        matches = word ? [...new Set([...args, ...FUNCTIONS,...MATH, ...variables()])].filter(f => f.toLowerCase().startsWith(word) && f.toLowerCase() !== word)
                : opened ? args : [];
        active = 0;
        if (!matches.length) return hideSuggest();
        suggestFor = mf;
        renderSuggest();

    }

    function renderSuggest () {
        suggest.innerHTML = "";
        const atStart = suggestFor.position === currentWord(suggestFor).length;
        matches.forEach((f,i) => {
            const el = document.createElement("div");
            el.textContent= f;
            if (atStart || MATH.includes(f)) el.style.color = wordColor(f) ?? "";
            if (i === active) el.classList.add("active");
            el.addEventListener("mousedown", e => { e.preventDefault(); active = i; accept(); })
            suggest.append(el);
        });
        suggest.querySelector(".active")?.scrollIntoView({ block: "nearest" });
        requestAnimationFrame(() =>{
            const line = suggestFor.getBoundingClientRect();
            const caret = suggestFor.shadowRoot?.querySelector(".ML__caret")?.getBoundingClientRect();
            suggest.style.left = (caret ? caret.left : line.left) + "px";
            suggest.style.top = line.bottom + "px";
            suggest.style.display = "block";
        });
    }

    function accept() {
        const mf = suggestFor, word = currentWord(mf), name = matches[active], p = mf.position;
        const inHelp = strip(mf.value).startsWith("Help");
        hideSuggest();
        mf.selection = { ranges: [[p - word.length, p]] };
        mf.executeCommand(["insert", (FUNCTIONS.includes(name) && !inHelp) || MATH.includes(name) ? `${name}\\left(#?\\right)` : name, { selectionMode: "placeholder" }]);
    }

    editor.addEventListener("scroll",hideSuggest);
    const tooltip = document.getElementById("tooltip");
    let HELP = {}, helptimer = null, helpfor = null;

    function hideHelp() {
        clearTimeout(helptimer);
        helpfor = null;
        tooltip.style.display = "none";
    }

    function showHelp(e){
        const mf = e.target;
        const name = isField(mf) && !isOut(mf) && strip(mf.value).match(/^[A-Za-zæøåÆØÅ]+/)?.[0]
        const a = HELP[name] && mf.getElementInfo(1)?.bounds;
        const b = a && mf.getElementInfo(name.length)?.bounds;
        if (!b || e.clientX <a.left || e.clientX > b.right || e.clientY < a.top || e.clientY > a.bottom) return hideHelp();
        if (helpfor === mf) return;
        hideHelp();
        helpfor = mf;
        helptimer = setTimeout(() => {
            const [, head, rest] = HELP[name].match(/^([^(]*)(.*)$/s);
            const span = document.createElement("span");
            span.textContent = head;
            span.style.color = wordColor(name);
            tooltip.replaceChildren(span,rest);
            tooltip.style.left = a.left + "px";
            tooltip.style.top = a.bottom + 4 + "px";
            tooltip.style.display = "block";


        },300);
    }

    editor.addEventListener("mousemove", showHelp);
    editor.addEventListener("mouseleave", hideHelp);
    editor.addEventListener("scroll", hideHelp);
    editor.addEventListener("keydown", hideHelp, true);

    function lines() { return [...editor.querySelectorAll("math-field:not(.out)")]; }

    const isOut = el => el && el.classList.contains("out");

    function prevLine(mf) {
        let el = mf.previousElementSibling;
        while (isOut(el)) el = el.previousElementSibling;
        return el;
    }

    function nextLine(mf) {
        let el = mf.nextElementSibling;
        while (isOut(el)) el = el.nextElementSibling;
        return el;
    }

    function clearOutput(mf) {
        while (isOut(mf.nextElementSibling)) mf.nextElementSibling.remove();
    }

    const LOOP = /^Loop\\left\((\d+),(\d+),(.+)\\right\)$/;

    function rember(mf) {
        const m = strip(mf.value).match(LOOP);
        const all = [...editor.children];
        mf.loop = m ? [all[m[1]-1], all[m[2]-1], m[3]] : null
    }

    function renumberLoops() {
        const all = [...editor.children];
        for (const mf of lines()) {
            if (!mf.loop) continue;
            const [start,end,count] = mf.loop;
            const a = all.indexOf(start) + 1, b = all.indexOf(end) + 1;
            if (!a || !b) continue;
            const raw = `Loop\\left(${a},${b},${count}\\right)`;
            if (strip(mf.value) !== raw) setLine(mf,raw);
        }
    }

    const isField = el => el && el.tagName === "MATH-FIELD";

    function prevField(el) {
        do el = el.previousElementSibling; while (el && !isField(el));
        return el;
    }

    function nextField(el) {
        do el = el.nextElementSibling; while (el && !isField(el));
        return el;
    }

    function focusLine(mf, where = "end") {
        if (!mf) return;
        mf.focus();
        mf.position = where === "end" ? mf.lastOffset : 0;
    }

    function setupField(mf) {
        mf.mathModeSpace = "\\:";
        mf.inlineShortcuts = {"*": "\\cdot", "->": "\\to","<->": "\\rightleftharpoons"};
        mf.mathVirtualKeyboardPolicy = "manual";
        mf.addEventListener("keydown", onKey, true);
    }

    function newLine(after = null, raw = "") {
        const mf = new MathfieldElement();
        if (after) after.after(mf); else editor.append(mf);
        setupField(mf);
        setLine(mf, raw);
        mf.addEventListener("input", () => { clearOutput(mf); makeSqrt(mf); recolour(mf); rember(mf);  updateSuggest(mf); record(); });
        mf.addEventListener("blur",hideSuggest);
        return mf;
    }

    const undoStack = [];
    let current = null;

    function snapshot () {
        const all = lines();
        const mf = document.activeElement;
        return {raws: all.map(l => strip(l.value)), line: all.indexOf(mf), position: mf?.position ?? 0};
    }

    function record() {
        const next = snapshot();
        if (current && current.raws.join("\n") !== next.raws.join("\n")) undoStack.push(current);
        current = next;
    }

    function undo() {
        const s = undoStack.pop();
        if (!s) return;
        hideSuggest();
        const all = lines();
        while (all.length > s.raws.length) {
            const mf = all.pop();
            clearOutput(mf);
            mf.remove();
        }
        while (all.length < s.raws.length) all.push(newLine());
        all.forEach((mf,i) =>{
            if (strip(mf.value) === s.raws[i]) return;
            clearOutput(mf);
            setLine(mf,s.raws[i]);
            rember(mf);

        });
        const mf = all[s.line] ?? all.at(-1);
        mf.focus();
        mf.position = Math.min(s.position,mf.lastOffset);
        current = snapshot();
        updateHint();
    }


    function onKey(e) {
        const mf = e.currentTarget;
        const stop = () => { e.preventDefault(); e.stopPropagation(); };
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { stop(); undo(); return; }
        const atStart = mf.position === 0 && mf.selectionIsCollapsed;
        const atEnd = mf.position === mf.lastOffset && mf.selectionIsCollapsed;
        const up = prevField(mf), down = nextField(mf);

        if (suggestFor === mf) {
            if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                stop();
                active = (active + (e.key === "ArrowDown" ? 1: -1) + matches.length) % matches.length;
                renderSuggest();
                return;
            }
            if (e.key === "Tab" || (e.key === "Enter" && !e.ctrlKey && !e.metaKey)) {stop(); accept(); return;}
            if (e.key === "Escape") {stop(); hideSuggest(); return;}
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") hideSuggest();
        }


        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { stop(); run(); return; }
        if (e.key === "ArrowUp" && up) { stop(); focusLine(up); return; }
        if (e.key === "ArrowDown" && down) { stop(); focusLine(down); return; }
        if (e.key === "ArrowLeft" && atStart && up) { stop(); focusLine(up, "end"); return; }
        if (e.key === "ArrowRight" && atEnd && down) { stop(); focusLine(down, "start"); return; }
        if (e.key === "_") { stop(); mf.executeCommand("moveToSubscript"); return; }
        if (e.shiftKey && e.code === "BracketRight") { stop(); mf.executeCommand("moveToSuperscript"); return; }
        if (isOut(mf)) {
            if (e.key === "Enter") {
                stop();
                let last = mf;
                while (isOut(last.nextElementSibling)) last = last.nextElementSibling;
                focusLine(newLine(last), "start");
                record();
            }
            return;
        }

        const prev = prevLine(mf), next = nextLine(mf);
        if (e.key === "Enter") {
            // split the line at the cursor, like a normal text editor
            stop();
            clearOutput(mf);
            const before = strip(mf.getValue(0, mf.position, "latex"));
            const after = strip(mf.getValue(mf.position, mf.lastOffset, "latex"));
            setLine(mf, before);
            focusLine(newLine(mf, after), "start");
            record();
            return;
        }
        if (e.key === "Backspace" && atStart && prev) {
            // join this line onto the end of the previous one
            stop();
            clearOutput(prev);
            clearOutput(mf);
            const join = prev.lastOffset;
            setLine(prev, strip(prev.value) + strip(mf.value));
            mf.remove();
            prev.focus();
            prev.position = join;
            record();
            return;
        }
        if (e.key === "Delete" && atEnd && next) {
            stop();
            clearOutput(mf);
            clearOutput(next);
            const join = mf.lastOffset;
            setLine(mf, strip(mf.value) + strip(next.value), join);
            next.remove();
            record();
            return;
        }
        if (e.key === "/") { stop(); mf.executeCommand(["insert", "\\frac{#@}{#?}"]); return; }
        if (e.key === "[") { stop(); mf.executeCommand(["insert", "\\left\\lbrack#?\\right\\rbrack"]); return; }
    }

    // clicking the empty space below the text continues at the end, like one big text area
    editor.addEventListener("mousedown", e => {
        if (e.target === editor && e.offsetX < editor.clientWidth) { e.preventDefault(); focusLine(lines().at(-1)); }
    });

    function run() {
        if (!bridge) return;
        const all = [...editor.children];
        const text = all.map(el => isOut(el) ? "" : strip(el.value));
        bridge.run(JSON.stringify(text),rows => showOutput(JSON.parse(rows),all))
    }
    const PLOT_COLORS = ["#00d9ff", "#ff6ec7", "#ffd166", "#06ffa5", "#c77dff", "#ff9e6d"];
    const tidy = (v,digits) => +v.toPrecision(digits) || 0;

    function niceStep(range) {
        const raw = range / 8;
        const p = 10**Math.floor(Math.log10(raw));
        const n = raw / p;
        return p * (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10);
    }

    function plotElement(data) {
        const el = document.createElement("div");
        el.className = "plot";
        const canvas = document.createElement("canvas");
        const legend = document.createElement("div");
        legend.className = "legend";
        const coords = document.createElement("div");
        coords.className = "coords";
        el.append(canvas, legend, coords);

        const fns = data.functions.map(f => new Function("x",`return ${f.js};`));
        data.functions.forEach((f,i) => {
            const row = document.createElement("div");
            const swatch = document.createElement("span");
            swatch.className = "swatch";
            swatch.style.background = PLOT_COLORS[i % PLOT_COLORS.length];
            const label = new MathfieldElement();
            label.classList.add("out");
            label.readOnly = true;
            label.value = f.label;
            row.append(swatch, label);
            legend.append(row);

        });

        const ys = [];
        for (let i = 0; i <=400; i++) {
            const x = data.start + (data.end - data.start) * i/400;
            for (const f of fns) {
                const y = f(x);
                if (Number.isFinite(y)) ys.push(y);

            }
        }
        let y0 = ys.length ? Math.min(...ys) : -10, y1 = ys.length ? Math.max(...ys) : 10;
        if (y0 === y1) { y0 -= 1; y1 += 1; }
        const pad = (y1 - y0) * 0.1;
        const home = { x0: data.start, x1: data.end, y0: y0 - pad, y1: y1 + pad };
        let view = { ...home }, drag = null;
        
        function at(e) {
            const r = canvas.getBoundingClientRect();
            return [view.x0 + (e.clientX - r.left) / r.width * (view.x1 - view.x0),
                    view.y1 - (e.clientY - r.top) / r.height * (view.y1 - view.y0)];

        }

        function draw() {
            const w = canvas.clientWidth, h = canvas.clientHeight, dpr = devicePixelRatio;
            canvas.width = w*dpr;
            canvas.height = h*dpr;
            const ctx = canvas.getContext("2d");
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const px = x => (x - view.x0) / (view.x1 - view.x0) * w;
            const py = y => h - (y - view.y0) / (view.y1 - view.y0) * h;

            ctx.fillStyle = "#323232";
            ctx.fillRect(0, 0, w, h);
            ctx.lineWidth = 1;
            ctx.font = "12px sans-serif";
            ctx.fillStyle = "#ffffff";

            const sx = niceStep(view.x1 - view.x0), sy = niceStep(view.y1 - view.y0);
            const labelY = Math.min(Math.max(py(0) + 14, 14), h - 4);
            const labelX = Math.min(Math.max(px(0) + 4, 4), w - 40);
            for (let i = Math.ceil(view.x0 / sx); i * sx <= view.x1; i++) {
                const x = i * sx;
                ctx.strokeStyle = "#28282e";
                ctx.beginPath(); ctx.moveTo(px(x), 0); ctx.lineTo(px(x), h); ctx.stroke();
                ctx.fillText(tidy(x, 12), px(x) + 3, labelY);
            }
            for (let i = Math.ceil(view.y0 / sy); i * sy <= view.y1; i++) {
                const y = i * sy;
                ctx.strokeStyle = "#28282e";
                ctx.beginPath(); ctx.moveTo(0, py(y)); ctx.lineTo(w, py(y)); ctx.stroke();
                if (i !== 0) ctx.fillText(tidy(y, 12), labelX, py(y) - 3);
            }
            ctx.strokeStyle = "#858585";
            ctx.beginPath(); ctx.moveTo(px(0), 0); ctx.lineTo(px(0), h); ctx.moveTo(0, py(0)); ctx.lineTo(w, py(0)); ctx.stroke();
            
            ctx.lineWidth = 2.2;
            fns.forEach((f, i) => {
                ctx.strokeStyle = PLOT_COLORS[i % PLOT_COLORS.length];
                ctx.beginPath();
                let pen = false, last = 0;
                for (let s = 0; s <= w; s++) {
                    const Y = Math.min(Math.max(py(f(view.x0 + (view.x1 - view.x0) * s / w)), -1e4), h + 1e4);
                    if (!Number.isFinite(Y)) { pen = false; continue; }
                    if (pen && Math.abs(Y - last) < h) ctx.lineTo(s, Y); else ctx.moveTo(s, Y);
                    pen = true;
                    last = Y;
                }
                ctx.stroke();
            });
        }
        canvas.addEventListener("pointerdown", e => {
            canvas.setPointerCapture(e.pointerId);
            drag = { x: e.clientX, y: e.clientY, view: { ...view } };
        });
        canvas.addEventListener("pointermove", e => {
            if (drag) {
                const dx = (e.clientX - drag.x) / canvas.clientWidth * (drag.view.x1 - drag.view.x0);
                const dy = (e.clientY - drag.y) / canvas.clientHeight * (drag.view.y1 - drag.view.y0);
                view = { x0: drag.view.x0 - dx, x1: drag.view.x1 - dx, y0: drag.view.y0 + dy, y1: drag.view.y1 + dy };
                draw();
            }
            const [x, y] = at(e);
            coords.textContent = `x = ${tidy(x, 4)}   y = ${tidy(y, 4)}`;
        });
        canvas.addEventListener("pointerup", () => drag = null);
        canvas.addEventListener("pointerleave", () => coords.textContent = "");
        canvas.addEventListener("wheel", e => {
            if (!e.ctrlKey) return;
            e.preventDefault();
            const [x, y] = at(e);
            const f = e.deltaY > 0 ? 1.2 : 1 / 1.2;
            view = { x0: x + (view.x0 - x) * f, x1: x + (view.x1 - x) * f, y0: y + (view.y0 - y) * f, y1: y + (view.y1 - y) * f };
            draw();
        }, { passive: false });
        canvas.addEventListener("dblclick", () => { view = { ...home }; draw(); });

        requestAnimationFrame(draw);
        return el;
    }


    // rows: [["code" | "result" | "error", latex], ...] in document order
    function showOutput(rows,all) {
        lines().forEach(clearOutput)
        let k = 0, anchor = lines().at(-1);
        for (const [kind, latex] of rows) {
            if (kind ==="code") {anchor = all[k++]; continue; }
            let el;
            if (kind ==="image") {
                el = document.createElement("div");
                const img = document.createElement("img");
                img.src = latex;
                el.append(img);
            } else if (kind === "plot") {
                el = plotElement(JSON.parse(latex));
            } else {
            
            
                el = new MathfieldElement();
                el.classList.add(kind);
            }
            el.classList.add("out");
            anchor.after(el);
            if (isField(el)) { setupField(el); el.value = latex; }
            anchor = el;
        }
    }
    

    function setAccent(c) { document.documentElement.style.setProperty("--accent", c); }

    if (typeof qt !== "undefined") {
        new QWebChannel(qt.webChannelTransport, ch =>{
            bridge = ch.objects.bridge;
            bridge.help(h => HELP = JSON.parse(h))
        });
    }

    const idle = () => document.body.classList.toggle("idle", !document.hasFocus());
    window.addEventListener("focus",idle);
    window.addEventListener("blur",idle);
    idle();
    new MutationObserver(renumberLoops).observe(editor,{ childList: true})

    const key = navigator.userAgent.includes("Mac") ? "Command" : "ctrl";
    const first = newLine();
    const hint = `\\textcolor{#858585}{\\text{Skriv din udregning her og tryk ${key}+Enter for at regne}}`;
    const updateHint = () => first.placeholder = lines().every(mf => mf.value === "") ? hint : "";
    editor.addEventListener("input",updateHint);
    updateHint();
    focusLine(first);
    current = snapshot();


</script>
